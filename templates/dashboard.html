<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sniper Scalping Dashboard</title>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#020617;
color:white;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:32px;
font-weight:bold;
}

.status{
background:#16a34a;
padding:10px 18px;
border-radius:12px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#0f172a;
padding:20px;
border-radius:20px;
border:1px solid #1e293b;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.label{
color:#94a3b8;
margin-bottom:10px;
}

.value{
font-size:28px;
font-weight:bold;
}

.green{
color:#22c55e;
}

.red{
color:#ef4444;
}

.yellow{
color:#facc15;
}

.chart-box{
margin-top:30px;
background:#0f172a;
padding:20px;
border-radius:20px;
}

</style>
</head>
<body>

<div class="header">
<div class="title">
🚀 Sniper Scalping Dashboard
</div>

<div class="status">
LIVE
</div>
</div>

<div class="grid">

<div class="card">
<div class="label">PAIR</div>
<div class="value yellow" id="symbol">-</div>
</div>

<div class="card">
<div class="label">SIGNAL</div>
<div class="value" id="signal">-</div>
</div>

<div class="card">
<div class="label">PRICE</div>
<div class="value" id="price">0</div>
</div>

<div class="card">
<div class="label">BALANCE</div>
<div class="value green" id="balance">0</div>
</div>

<div class="card">
<div class="label">PNL</div>
<div class="value" id="pnl">0</div>
</div>

<div class="card">
<div class="label">PNL IDR</div>
<div class="value" id="pnl_idr">0</div>
</div>

<div class="card">
<div class="label">POSITION</div>
<div class="value" id="position">NONE</div>
</div>

<div class="card">
<div class="label">ENTRY</div>
<div class="value" id="entry">0</div>
</div>

<div class="card">
<div class="label">RSI</div>
<div class="value" id="rsi">0</div>
</div>

<!-- LONG SCORE -->
<div class="card">
<div class="label">LONG SCORE</div>
<div class="value green" id="long_score">0</div>
</div>

<!-- SHORT SCORE -->
<div class="card">
<div class="label">SHORT SCORE</div>
<div class="value red" id="short_score">0</div>
</div>

<div class="card">
<div class="label">VOLUME RATIO</div>
<div class="value" id="volume_ratio">0</div>
</div>

<div class="card">
<div class="label">WINRATE</div>
<div class="value" id="winrate">0%</div>
</div>

</div>

<div class="chart-box">
<h2 style="margin-bottom:20px;">📈 Realtime PNL Chart</h2>
<canvas id="pnlChart"></canvas>
</div>

<div class="chart-box">
<h2 style="margin-bottom:20px;">📊 Live TradingView Chart</h2>
<div class="tradingview-widget-container">
  <div id="tradingview_chart"></div>
</div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

const socket = io({
    transports: ['websocket'],
    reconnection: true
});

const labels = [];
const pnlData = [];

const ctx = document.getElementById('pnlChart');

const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: labels,
        datasets: [{
            label: 'Realtime PNL',
            data: pnlData,
            borderWidth: 3,
            tension: 0.4
        }]
    }
});

new TradingView.widget({
  "width": "100%",
  "height": 500,
  "symbol": "BINANCE:DOGEUSDT",
  "interval": "3",
  "timezone": "Asia/Jakarta",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "toolbar_bg": "#0f172a",
  "enable_publishing": false,
  "hide_top_toolbar": false,
  "save_image": false,
  "container_id": "tradingview_chart"
});

socket.on('update', function(data){

    document.getElementById('symbol').innerText = data.symbol;

    document.getElementById('signal').innerText = data.signal;

    document.getElementById('price').innerText =
        Number(data.price).toFixed(4);

    document.getElementById('balance').innerText =
        '$' + Number(data.balance).toFixed(2);

    document.getElementById('pnl').innerText =
        Number(data.pnl).toFixed(4);

    document.getElementById('pnl_idr').innerText =
        'Rp ' + Number(data.pnl_idr).toLocaleString();

    document.getElementById('position').innerText =
        data.position;

    document.getElementById('entry').innerText =
        Number(data.entry).toFixed(4);

    document.getElementById('rsi').innerText =
        Number(data.rsi).toFixed(2);

    // LONG SCORE
    document.getElementById('long_score').innerText =
        data.long_score;

    // SHORT SCORE
    document.getElementById('short_score').innerText =
        data.short_score;

    document.getElementById('volume_ratio').innerText =
        Number(data.volume_ratio).toFixed(2);

    document.getElementById('winrate').innerText =
        Number(data.winrate).toFixed(2) + '%';

    // SIGNAL COLOR
    const signalEl =
        document.getElementById('signal');

    signalEl.classList.remove(
        'green',
        'red',
        'yellow'
    );

    if(data.signal === "LONG"){
        signalEl.classList.add('green');
    }
    else if(data.signal === "SHORT"){
        signalEl.classList.add('red');
    }
    else{
        signalEl.classList.add('yellow');
    }

    // PNL COLOR
    const pnlEl =
        document.getElementById('pnl');

    pnlEl.classList.remove(
        'green',
        'red'
    );

    if(data.pnl >= 0){
        pnlEl.classList.add('green');
    }else{
        pnlEl.classList.add('red');
    }

    // CHART UPDATE
    labels.push(
        new Date().toLocaleTimeString()
    );

    pnlData.push(data.pnl);

    if(labels.length > 30){

        labels.shift();

        pnlData.shift();
    }

    chart.update('none');

});

</script>

</body>
</html>
