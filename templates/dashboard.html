<script>

const socket = io({
    transports: ['websocket'],
    reconnection: true
});

const labels = [];
const pnlData = [];

const ctx = document.getElementById('pnlChart');

const chart = new Chart(ctx, {

    type: 'line',

    data: {

        labels: labels,

        datasets: [{

            label: 'Realtime PNL',

            data: pnlData,

            borderWidth: 3,

            tension: 0.4

        }]
    },

    options: {

        responsive:true,

        plugins:{
            legend:{
                labels:{
                    color:'white'
                }
            }
        },

        scales:{

            x:{
                ticks:{
                    color:'white'
                }
            },

            y:{
                ticks:{
                    color:'white'
                }
            }
        }
    }
});

new TradingView.widget({

    "width": "100%",
    "height": 550,
    "symbol": "BINANCE:DOGEUSDT",
    "interval": "1",
    "timezone": "Asia/Jakarta",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#0f172a",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "save_image": false,
    "container_id": "tradingview_chart"

});

socket.on('update', function(data){

    // =========================
    // BASIC
    // =========================
    document.getElementById('symbol').innerText =
        data.symbol || '-';

    document.getElementById('price').innerText =
        Number(data.price || 0).toFixed(4);

    document.getElementById('balance').innerText =
        '$' + Number(data.balance || 0).toFixed(2);

    document.getElementById('position').innerText =
        data.position || 'NONE';

    document.getElementById('entry').innerText =
        Number(data.entry || 0).toFixed(4);

    // =========================
    // TP SL TRAIL
    // =========================
    document.getElementById('sl').innerText =
        Number(data.sl_price || 0).toFixed(4);

    document.getElementById('tp').innerText =
        Number(data.tp_price || 0).toFixed(4);

    document.getElementById('trail').innerText =
        Number(data.trailing_stop || 0).toFixed(4);

    // =========================
    // PNL
    // =========================
    document.getElementById('pnl').innerText =
        Number(data.pnl || 0).toFixed(4);

    document.getElementById('pnl_idr').innerText =
        'Rp ' + Number(data.pnl_idr || 0).toLocaleString();

    // =========================
    // RSI
    // =========================
    document.getElementById('rsi').innerText =
        Number(data.rsi || 0).toFixed(2);

    // =========================
    // TREND
    // =========================
    const trendEl =
        document.getElementById('market_trend');

    trendEl.innerText =
        data.trend || '-';

    trendEl.classList.remove(
        'green',
        'red',
        'yellow'
    );

    if(data.trend === 'BULLISH'){
        trendEl.classList.add('green');
    }

    else if(data.trend === 'BEARISH'){
        trendEl.classList.add('red');
    }

    else{
        trendEl.classList.add('yellow');
    }

    // =========================
    // STRUCTURE
    // =========================
    const structureEl =
        document.getElementById(
            'market_structure'
        );

    structureEl.innerText =
        data.structure || '-';

    structureEl.classList.remove(
        'green',
        'red',
        'yellow'
    );

    if(data.structure === 'BREAKOUT'){
        structureEl.classList.add('green');
    }

    else if(
        data.structure === 'BREAKDOWN'
    ){
        structureEl.classList.add('red');
    }

    else{
        structureEl.classList.add('yellow');
    }

    // =========================
    // SCORES
    // =========================
    document.getElementById('long_score').innerText =
        Number(data.long_score || 0);

    document.getElementById('short_score').innerText =
        Number(data.short_score || 0);

    // =========================
    // MARKET DATA
    // =========================
    document.getElementById('volume_ratio').innerText =
        Number(data.volume_ratio || 0).toFixed(2);

    document.getElementById('atr_percent').innerText =
        Number(data.atr_percent || 0).toFixed(4);

    // =========================
    // WINRATE
    // =========================
    document.getElementById('winrate').innerText =
        Number(data.winrate || 0).toFixed(2) + '%';

    document.getElementById('trade_count').innerText =
        Number(data.trade_count || 0);

    // =========================
    // SIGNAL COLOR
    // =========================
    const signalEl =
        document.getElementById('signal');

    signalEl.innerText =
        data.signal || 'NONE';

    signalEl.classList.remove(
        'signal-long',
        'signal-short',
        'signal-none'
    );

    if(data.signal === 'LONG'){

        signalEl.classList.add(
            'signal-long'
        );

    }

    else if(data.signal === 'SHORT'){

        signalEl.classList.add(
            'signal-short'
        );

    }

    else{

        signalEl.classList.add(
            'signal-none'
        );

    }

    // =========================
    // PNL COLOR
    // =========================
    const pnlEl =
        document.getElementById('pnl');

    pnlEl.classList.remove(
        'green',
        'red'
    );

    if(Number(data.pnl) >= 0){

        pnlEl.classList.add('green');

    }

    else{

        pnlEl.classList.add('red');

    }

    // =========================
    // REALTIME CHART
    // =========================
    labels.push(
        new Date().toLocaleTimeString()
    );

    pnlData.push(
        Number(data.pnl || 0)
    );

    if(labels.length > 50){

        labels.shift();
        pnlData.shift();

    }

    chart.update('none');

});

</script>
